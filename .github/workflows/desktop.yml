# Floe for Linux and Windows (desktop/, a Tauri app). Run it by hand to get the builds as
# workflow artifacts; on a v* tag it also attaches them to that release (creating a draft
# release if there isn't one yet; the macOS Floe.app zip is added from a Mac).
name: desktop

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", "proxy/**", "install.sh", "install.ps1", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            bundles: appimage,deb
          - os: ubuntu-22.04-arm
            name: linux-aarch64
            bundles: appimage,deb
          - os: windows-latest
            name: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - name: Build
        working-directory: desktop
        run: |
          bun install --frozen-lockfile
          bun x tauri build --bundles ${{ matrix.bundles }}

      - name: Rust tests (the GNOME shortcut against GNOME's real schemas, in a scratch store)
        if: matrix.name == 'linux-x86_64'
        working-directory: desktop/src-tauri
        run: |
          sudo apt-get install -y gnome-settings-daemon-common gsettings-desktop-schemas
          export GSETTINGS_BACKEND=keyfile XDG_CONFIG_HOME=$(mktemp -d) FLOE_GSETTINGS_TEST=1
          cargo test --lib -- --test-threads=1
          cat "$XDG_CONFIG_HOME/glib-2.0/settings/keyfile"

      - name: Collect (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          B=desktop/src-tauri/target/release
          cp "$(ls $B/bundle/appimage/*.AppImage | head -1)" "out/Floe-${{ matrix.name }}.AppImage"
          DEB_ARCH=$([ "${{ matrix.name }}" = linux-x86_64 ] && echo amd64 || echo arm64)
          cp "$(ls $B/bundle/deb/*.deb | head -1)" "out/Floe-linux-$DEB_ARCH.deb"
          ls -la out

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $B = "desktop/src-tauri/target/release"
          Copy-Item "$B/floe.exe" "out/Floe-${{ matrix.name }}.exe"
          Copy-Item (Get-ChildItem "$B/bundle/nsis/*-setup.exe" | Select-Object -First 1).FullName "out/Floe-${{ matrix.name }}-setup.exe"
          Get-ChildItem out

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          chmod +x out/*.AppImage
          # it should start, stay up and draw a window under a virtual display
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a out/Floe-${{ matrix.name }}.AppImage > app.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "running"; else cat app.log; exit 1; fi
          tail -20 app.log
          kill $PID || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -FilePath "out/Floe-${{ matrix.name }}.exe"
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Floe exited with $($p.ExitCode)" }
          Write-Host "running"
          Stop-Process -Id $p.Id -Force

      # Auto-update, the whole way: lay out an installed Floe from this build, make it look old, ask
      # it to update. The installer (from main, as users get it) must survive stopping Floe and
      # its proxy, put the newest release in place, and start Floe again.
      - name: Auto-update end to end (Linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          P="$HOME/.local/share/floe"
          mkdir -p "$P"
          cp -R proxy sage brain "$P/"
          cp out/Floe-linux-x86_64.AppImage "$P/Floe.AppImage" && chmod +x "$P/Floe.AppImage"
          sed -i 's/"version": "[^"]*"/"version": "0.0.1"/' "$P/proxy/package.json"
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          export DISPLAY=:99 APPIMAGE_EXTRACT_AND_RUN=1
          "$P/Floe.AppImage" > app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7717/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS 'http://127.0.0.1:7717/version?check=1'; echo
          curl -fsS -X POST http://127.0.0.1:7717/update; echo
          ok=0
          for i in $(seq 1 240); do
            if ! grep -qs '"0.0.1"' "$P/proxy/package.json" && curl -fsS http://127.0.0.1:7717/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          echo "--- update.log"; cat "$HOME/.local/state/floe/update.log" || true
          echo "--- proxy.log"; tail -20 "$HOME/.local/state/floe/proxy.log" || true
          echo "--- processes"; ps -eo pid,args | grep -iE "[f]loe|[b]un " | cut -c1-160 || true
          test $ok = 1

      - name: Auto-update end to end (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $P = "$env:LOCALAPPDATA\Floe"
          New-Item -ItemType Directory -Force $P | Out-Null
          foreach ($d in "proxy", "sage", "brain") { Copy-Item -Recurse -Force $d "$P\$d" }
          Copy-Item "out/Floe-windows-x64.exe" "$P\floe.exe"
          (Get-Content "$P\proxy\package.json") -replace '"version": "[^"]*"', '"version": "0.0.1"' | Set-Content "$P\proxy\package.json"
          Start-Process -FilePath "$P\floe.exe"
          $up = $false
          foreach ($i in 1..60) { try { Invoke-RestMethod http://127.0.0.1:7717/health | Out-Null; $up = $true; break } catch { Start-Sleep 1 } }
          if (-not $up) { Get-Content "$P\logs\app.log", "$P\logs\proxy.log" -ErrorAction SilentlyContinue; throw "Floe's proxy didn't start" }
          Invoke-RestMethod 'http://127.0.0.1:7717/version?check=1' | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post http://127.0.0.1:7717/update | ConvertTo-Json -Compress
          $done = $false
          foreach ($i in 1..240) {
            Start-Sleep 1
            $old = (Test-Path "$P\proxy\package.json") -and (Select-String -Quiet -Pattern '"0.0.1"' -Path "$P\proxy\package.json")
            if (-not $old) { try { Invoke-RestMethod http://127.0.0.1:7717/health | Out-Null; $done = $true; break } catch {} }
          }
          Write-Host "--- update.log"; Get-Content "$P\logs\update.log" -ErrorAction SilentlyContinue
          Write-Host "--- proxy.log"; Get-Content "$P\logs\proxy.log" -Tail 20 -ErrorAction SilentlyContinue
          Get-Process floe, bun -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path
          Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe'" | Format-Table ProcessId, ParentProcessId, CreationDate, @{ n = "cmd"; e = { $_.CommandLine.Substring(0, [Math]::Min(120, $_.CommandLine.Length)) } } -AutoSize
          if (-not $done) { throw "the update didn't finish" }

      - uses: actions/upload-artifact@v4
        with:
          name: floe-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach to the release
        run: |
          ls -la out
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Floe ${TAG#v}" --notes "Building…"
          gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
