name: debug-spawn
on:
  pull_request:
    paths: [".github/workflows/debug-spawn.yml"]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\sp"; New-Item -ItemType Directory -Force $d | Out-Null
          @'
          import { spawn } from "node:child_process";
          const d = process.argv[2];
          // each child outlives this process: it writes its marker 6 s later; bun exits after 2 s
          const late = (tag) => `Start-Sleep 6; Set-Content -Path '${d}\\${tag}.marker' -Value ran`;
          // E: plain child (not detached)
          const e = spawn("powershell.exe", ["-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", late("E")], { stdio: "ignore", windowsHide: true });
          e.on("exit", (c) => console.log("E exit", c));
          // F: through WMI (Win32_Process.Create), so it isn't our child at all
          const inner = Buffer.from(`& { ${late("F")}; Write-Output done } *>> '${d}\\F.log'`, "utf16le").toString("base64");
          const launcher = `$r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -EncodedCommand ${inner}' }; exit $r.ReturnValue`;
          const f = spawn("powershell.exe", ["-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", launcher], { stdio: ["ignore", "inherit", "inherit"], windowsHide: true });
          f.on("exit", (c) => console.log("F launcher exit", c));
          setTimeout(() => process.exit(0), 2500);
          '@ | Set-Content "$d\t.ts"
          bun "$d\t.ts" $d
          Write-Host "bun exited"
          Start-Sleep 10
          Get-ChildItem $d | Format-Table Name, Length
          foreach ($f in "E","F") { if (Test-Path "$d\$f.marker") { Write-Host "$f survived" } else { Write-Host "$f did NOT survive" } }
          Get-Content "$d\F.log" -ErrorAction SilentlyContinue
