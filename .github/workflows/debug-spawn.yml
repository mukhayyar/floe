name: debug-spawn
on:
  pull_request:
    paths: [".github/workflows/debug-spawn.yml"]
jobs:
  iex:
    runs-on: windows-latest
    steps:
      - name: The README's install command, in Windows PowerShell
        shell: powershell
        run: |
          $env:FLOE_PREFIX = "$env:RUNNER_TEMP\floe-iex"; $env:FLOE_NO_START = "1"
          try { irm https://raw.githubusercontent.com/mukhayyar/floe/main/install.ps1 | iex; Write-Host "iex finished" } catch { Write-Host "iex FAILED: $_" }
          Get-ChildItem $env:FLOE_PREFIX -ErrorAction SilentlyContinue | Format-Table Name
  wmi:
    runs-on: windows-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\sp"; New-Item -ItemType Directory -Force $d | Out-Null
          @'
          const d = process.argv[2];
          const LOG = `${d}\\update.log`;
          const q = (s) => `'${s.replace(/'/g, "''")}'`;
          const script = [
            `"started $(Get-Date)" | Out-File -Append -FilePath ${q(LOG)}`,
            `$env:FLOE_PREFIX = ${q(d + "\\floe")}`,
            `$env:FLOE_NO_START = '1'`,
            `try { & { irm https://raw.githubusercontent.com/mukhayyar/floe/main/install.ps1 | iex } *>> ${q(LOG)} } catch { "FAILED: $_" | Out-File -Append -FilePath ${q(LOG)} }`,
            `"ended" | Out-File -Append -FilePath ${q(LOG)}`,
          ].join("; ");
          const encoded = Buffer.from(script, "utf16le").toString("base64");
          const command = `powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -EncodedCommand ${encoded}`;
          const launcher = ["$si = New-CimInstance -ClassName Win32_ProcessStartup -ClientOnly -Property @{ ShowWindow = [uint16]0 }",
            `$r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = ${q(command)}; ProcessStartupInformation = $si }`,
            "Write-Output \"pid $($r.ProcessId) rv $($r.ReturnValue)\"; exit $r.ReturnValue"].join("; ");
          const p = Bun.spawn(["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", launcher], { stdout: "inherit", stderr: "inherit" });
          console.log("launcher exit", await p.exited, "cmdline length", command.length);
          '@ | Set-Content "$d\t.ts"
          bun "$d\t.ts" $d
          Start-Sleep 60
          Write-Host "--- update.log"; Get-Content "$d\update.log" -ErrorAction SilentlyContinue
          Get-ChildItem "$d\floe" -ErrorAction SilentlyContinue | Format-Table Name
